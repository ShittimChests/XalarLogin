# ============ XalarLogin 配置 ============
#
# 安全提示：Paper 默认会把玩家执行的命令原文写进 logs/latest.log，
# 也就是说 /reg 和 /a 的密码会明文落盘。该日志早于插件事件触发，
# 插件无法拦截 —— 请把服务器根目录 spigot.yml 里的 commands.log 改为 false。

# ---------------- 存储后端 ----------------
# 两种后端的 JDBC 驱动都由 Paper 服务端自带，切换不需要装任何东西。
# 改动 storage 段后必须重启服务器。
storage:
  # sqlite：单文件，零配置，数据在 plugins/XalarLogin/data.db，适合单服
  # mysql ：外部数据库，适合多个服务器共享同一份账号
  type: sqlite

  # 仅当 type 为 mysql 时使用。数据库需要你自己预先创建好
  # （例：CREATE DATABASE xalarlogin DEFAULT CHARSET utf8mb4;），
  # 插件只会自动建表，不会自动建库
  mysql:
    host: localhost
    port: 3306
    # 数据库名，必须已存在
    database: xalarlogin
    user: xalarlogin
    password: ''
    # 表名，插件会自动创建。多个服务器想各用各的账号时改这里区分
    table: accounts
    # 追加到 JDBC URL 的参数，一般不用动
    properties: 'useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC'

# ---------------- 认证行为 ----------------

# 登录超时（秒）：加入服务器后超过此时间未注册/登录将被踢出
login-timeout-seconds: 60

# 密码连续错误达到此次数将被踢出服务器
max-login-attempts: 3

# 被踢出后的锁定时长（秒）：这段时间内该玩家名与该 IP 无法再进服尝试。
# 失败次数按玩家名和来源 IP 分别累计，重连不会清零，用于挡住反复重连爆破。
# 设为 0 表示不锁定（踢出后可立即重连再试，不推荐）
lockout-seconds: 300

# 密码最小长度
min-password-length: 6

# 未登录时的提示间隔（秒）
remind-interval-seconds: 5

# 同 IP 免密登录：用密码成功登录一次后，下次从相同 IP 进服自动登录；
# IP 变化或修改过密码则需重新输入密码。设为 false 关闭此功能
ip-session-enabled: true

# 密码哈希 PBKDF2 迭代次数，越高越难爆破但登录越慢（60 万约需 0.2 秒）。
# 低于 10 万会被自动抬回 10 万。调整后老账号仍按注册时的迭代次数校验，
# 只有新注册和改密码才会用上新值，不会导致任何人登录不了
password-hash-iterations: 600000

# 所有消息文案，支持 & 颜色代码
# 可用占位符：{min} 最小密码长度、{remaining} 剩余尝试次数、{player} 玩家名、
#             {seconds} 锁定剩余秒数、{count} 删除的记录数
messages:
  prefix: '&7[&6XalarLogin&7] &r'
  remind-register: '&e请输入 &6/reg <密码> <重复密码> &e来注册账号，例：&6/reg 123456 123456'
  remind-login: '&e请输入 &6/a <密码> &e登录账号'
  register-usage: '&c用法：/reg <密码> <重复密码>'
  login-usage: '&c用法：/a <密码>'
  changepw-usage: '&c用法：/changepw <旧密码> <新密码>'
  already-registered: '&c你已注册过账号，请使用 &6/a <密码> &c登录'
  not-registered: '&c你还未注册，请先使用 &6/reg <密码> <重复密码> &c注册'
  already-logged-in: '&a你已经登录了'
  loading: '&e正在加载你的数据，请稍候再试'
  processing: '&e正在处理你的上一条指令，请稍候'
  password-mismatch: '&c两次输入的密码不一致，请重新输入'
  password-too-short: '&c密码太短，至少需要 {min} 位'
  register-success: '&a注册成功，已自动登录，祝你游戏愉快！'
  login-success: '&a登录成功，欢迎回来！'
  auto-login: '&a检测到你上次登录的 IP，已自动登录，欢迎回来！'
  wrong-password: '&c密码错误！还剩 {remaining} 次机会'
  must-login-first: '&c请先登录后再进行操作'
  changepw-success: '&a密码修改成功'
  changepw-wrong-old: '&c旧密码错误'
  db-error: '&c数据出错，请稍后重试或联系管理员'
  player-only: '&c该命令只能由玩家执行'
  admin-usage: '&c用法：&6/xalar unregister <玩家> &c或 &6/xalar passwd <玩家> <新密码>'
  admin-unregister-success: '&a已删除玩家 {player} 的账号记录（共 {count} 条）'
  admin-passwd-success: '&a已重设玩家 {player} 的密码（共 {count} 条记录），免密登录已作废'
  admin-passwd-notify: '&e管理员已重设你的密码，请使用新密码登录'
  admin-player-not-found: '&c未找到玩家 {player} 的账号记录'
  kick-too-many-attempts: '&c密码错误次数过多，请稍后再试'
  kick-locked-out: '&c密码错误次数过多，请在 {seconds} 秒后再试'
  kick-timeout: '&c登录超时，请重新进入服务器'
  kick-db-error: '&c数据加载失败，请重新进入服务器'
  kick-unregistered: '&c你的账号已被管理员重置，请重新进服注册'
