name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (e.g. 1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Update version in pom.xml
        run: mvn -B -ntp versions:set -DnewVersion=${{ inputs.version }} versions:commit

      - name: Update version in plugin.yml
        run: |
          sed -i "s/^version: '.*'/version: '${{ inputs.version }}'/" src/main/resources/plugin.yml

      - name: Build
        run: mvn -B -ntp package

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: target/XalarLogin-${{ inputs.version }}.jar
